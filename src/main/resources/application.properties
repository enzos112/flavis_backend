# Conexión a MySQL en XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/flavis_db?serverTimezone=UTC&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jackson.serialization.write-dates-as-timestamps=false

# Tamaño máximo de archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.jackson.time-zone=America/Lima

# Credenciales de Administradores
flavis.admin1.email=${ADMIN1_EMAIL}
flavis.admin1.password=${ADMIN1_PASS}

flavis.admin2.email=${ADMIN2_EMAIL}
flavis.admin2.password=${ADMIN2_PASS}

# Configuración de Cloudinary
cloudinary.cloud_name=${CLOU_NAME}
cloudinary.api_key=${API_KEY}
cloudinary.api_secret=${API_SECRET}