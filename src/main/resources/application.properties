# ==========================================
# 1. CONEXIÓN A BASE DE DATOS
# ==========================================
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/flavis_db?serverTimezone=UTC&useSSL=false}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# 2. JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# 3. SEGURIDAD JWT
# ==========================================
jwt.secret=${JWT_SECRET:una_clave_secreta_muy_larga_y_segura_de_al_menos_32_caracteres_para_local}

# ==========================================
# 4. CREDENCIALES DE ADMINISTRADORES
# ==========================================
flavis.admin1.email=${ADMIN1_EMAIL:admin@flavis.com}
flavis.admin1.password=${ADMIN1_PASS:admin123}

flavis.admin2.email=${ADMIN2_EMAIL:enzo@flavis.com}
flavis.admin2.password=${ADMIN2_PASS:admin456}

# ==========================================
# 5. CONFIGURACIÓN DE CLOUDINARY
# ==========================================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# ==========================================
# 6. CONFIGURACIONES GENERALES
# ==========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Lima

# Tamaño máximo de archivos
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB